name: verify-register
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify register counts against the published headline
        run: python3 -I scripts/verify_register.py catalogue-2026-11-07.csv --expect 1695,1598,93,4,23
      - name: Run tests
        run: python3 -I -m unittest discover -s tests -v
        env:
          ALETHEIA_CATALOGUE: catalogue-2026-11-07.csv
